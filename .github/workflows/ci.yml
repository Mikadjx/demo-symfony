name: "CI/CD — Build, Tests & Deploy Preprod"

on:
  push:
    branches: [déploiement-fonctionnelle]
  pull_request:
    branches: [déploiement-fonctionnelle]

env:
  PHP_VERSION: '8.4'
  DATABASE_URL: "mysql://demo_user:demo_password@127.0.0.1:3306/demo_test?serverVersion=8.0&charset=utf8mb4"
  PREPROD_URL: "https://demo-nginx.dev.fabdevlab.fr/"
  DEFAULT_URI: "https://demo-nginx.dev.fabdevlab.fr/"

  

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 1 — BUILD
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "1 — Build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, zip, opcache
          tools: composer:v2
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Clear Symfony cache
        run: php bin/console cache:clear --env=test
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('composer.lock') }}

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 2 — SECURITY SCAN (SonarQube)
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: "2 — Security Scan (SonarQube)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run SonarQube static analysis
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://demo-sonarcube.dev.fabdevlab.fr
        with:
          args: >
            -Dsonar.projectKey=Demo-symfony
            -Dsonar.sources=src
            -Dsonar.tests=tests

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 3 — TESTS UNITAIRES
  # ─────────────────────────────────────────────────────────────────────────────
  test-unit:
    name: "3 — Unit Tests"
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, zip, opcache
          tools: composer:v2
          coverage: xdebug

      - name: Restore vendor cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('composer.lock') }}

      - name: Run unit tests
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: php vendor/bin/phpunit --testsuite=unit --testdox

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 4 — TESTS FONCTIONNELS
  # ─────────────────────────────────────────────────────────────────────────────
  test-functional:
    name: "4 — Functional Tests (Catalogue + Auth)"
    runs-on: ubuntu-latest
    needs: test-unit

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: demo_test
          MYSQL_USER: demo_user
          MYSQL_PASSWORD: demo_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, zip, opcache
          tools: composer:v2
          coverage: xdebug

      - name: Restore vendor cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('composer.lock') }}

      - name: Run database migrations
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Load fixtures
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Warmup cache for test env
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: php bin/console cache:warmup --env=test

      - name: Run functional tests with coverage
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          php -d memory_limit=512M vendor/bin/phpunit \
            --testsuite=functional \
            --testdox \
            --coverage-clover coverage.xml \
            --log-junit test-report.xml

      - name: Update SonarQube with coverage
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://demo-sonarcube.dev.fabdevlab.fr
        with:
          args: >
            -Dsonar.projectKey=Demo-symfony
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.php.tests.reportPath=test-report.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 5 — NON-RÉGRESSION PRÉ-DEPLOY (baseline)
  # ─────────────────────────────────────────────────────────────────────────────
  non-regression-pre:
    name: "5 — Non-Régression Pré-Deploy (baseline)"
    runs-on: ubuntu-latest
    needs: test-functional
    if: github.event_name == 'push'

    steps:
      - name: Baseline — Homepage HTTP 200
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.DEFAULT_URI }})
          if [ "$status" -ne 200 ]; then
            echo "❌ Homepage baseline échoue ($status) — preprod déjà instable"
            exit 1
          fi
          echo "✅ Homepage baseline OK ($status)"

      - name: Baseline — Login page HTTP 200
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.DEFAULT_URI }}/login)
          if [ "$status" -ne 200 ]; then
            echo "❌ Login baseline échoue ($status)"
            exit 1
          fi
          echo "✅ Login baseline OK ($status)"

      - name: Baseline — Catalogue protégé HTTP 302
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" --max-redirs 0 ${{ env.PREPROD_URL }}/product)
          if [ "$status" -ne 302 ]; then
            echo "❌ Protection catalogue baseline échoue ($status)"
            exit 1
          fi
          echo "✅ Catalogue baseline OK — redirect $status vers /login"

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 6 — DÉPLOIEMENT PREPROD (Coolify)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "6 — Deploy Preprod (Coolify)"
    runs-on: ubuntu-latest
    needs: non-regression-pre

    steps:
      - name: Trigger Coolify preprod deployment
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --fail \
            --silent \
            --show-error

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 7 — NON-RÉGRESSION POST-DEPLOY
  # ─────────────────────────────────────────────────────────────────────────────
  non-regression-post:
    name: "7 — Non-Régression Post-Deploy (régression ?)"
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Vérif — Homepage HTTP 200
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.PREPROD_URL }})
          if [ "$status" -ne 200 ]; then
            echo "❌ RÉGRESSION — Homepage retourne $status après deploy"
            exit 1
          fi
          echo "✅ Homepage OK ($status)"

      - name: Vérif — Login page HTTP 200
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.PREPROD_URL }}/login)
          if [ "$status" -ne 200 ]; then
            echo "❌ RÉGRESSION — Login retourne $status après deploy"
            exit 1
          fi
          echo "✅ Login OK ($status)"

      - name: Vérif — Catalogue protégé HTTP 302
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" --max-redirs 0 ${{ env.PREPROD_URL }}/product)
          if [ "$status" -ne 302 ]; then
            echo "❌ RÉGRESSION — /product retourne $status — protection cassée !"
            exit 1
          fi
          echo "✅ Catalogue protégé OK ($status)"

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 8 — TESTS DE CHARGE (K6 → Grafana Cloud)
  # ─────────────────────────────────────────────────────────────────────────────
  load-test:
    name: "8 — Load Tests (K6 → Grafana Cloud)"
    runs-on: ubuntu-latest
    needs: non-regression-post

    steps:
      - uses: actions/checkout@v4

      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Run K6 load test
        run: k6 cloud run k6/load-test.js
        env:
          BASE_URL: ${{ env.PREPROD_URL }}
          K6_USERNAME: ${{ secrets.E2E_USER_EMAIL }}
          K6_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          K6_CLOUD_TOKEN: ${{ secrets.GRAFANA_TOKEN }}