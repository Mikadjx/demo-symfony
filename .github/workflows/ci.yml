name: "CI/CD — Build, Tests & Deploy Preprod"

on:
  push:
    branches: [déploiement-fonctionnelle]
  pull_request:
    branches: [déploiement-fonctionnelle]

env:
  PHP_VERSION: '8.4'
  DATABASE_URL: "mysql://demo_user:demo_password@127.0.0.1:3306/demo_test?serverVersion=8.0&charset=utf8mb4"
  PREPROD_URL: "https://demo-nginx.dev.fabdevlab.fr/"
  DEFAULT_URI: "https://demo-nginx.dev.fabdevlab.fr/"

jobs:

  build:
    name: "1 - Build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, zip, opcache
          tools: composer:v2
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Clear Symfony cache
        run: php bin/console cache:clear --env=test
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('composer.lock') }}

  test-unit:
    name: "2 - Tests unitaires"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, zip, opcache
          tools: composer:v2
          coverage: xdebug

      - name: Restore vendor cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('composer.lock') }}

      - name: Run unit tests
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: php vendor/bin/phpunit --testsuite=unit --testdox

  test-functional:
    name: "3 - Tests fonctionnels (Catalogue + Auth)"
    runs-on: ubuntu-latest
    needs: test-unit

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: demo_test
          MYSQL_USER: demo_user
          MYSQL_PASSWORD: demo_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, zip, opcache
          tools: composer:v2
          coverage: xdebug

      - name: Restore vendor cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('composer.lock') }}

      - name: Run database migrations
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Load fixtures
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Warmup cache for test env
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: php bin/console cache:warmup --env=test

      - name: Run functional tests with coverage
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DEFAULT_URI: ${{ env.DEFAULT_URI }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          php -d memory_limit=512M vendor/bin/phpunit \
            --testsuite=functional \
            --testdox \
            --coverage-clover coverage.xml \
            --log-junit test-report.xml

      - name: Upload coverage and test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            test-report.xml
          retention-days: 1

  security-scan:
    name: "4 - Sécurité & Qualité (SonarQube)"
    runs-on: ubuntu-latest
    needs: test-functional 

    steps:
      - uses: actions/checkout@v4

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: .

      - name: Run SonarQube analysis with coverage
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://demo-sonarcube.dev.fabdevlab.fr
        with:
          args: >
            -Dsonar.projectKey=Demo-symfony
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.php.tests.reportPath=test-report.xml

  non-regression-pre:
    name: "5 — Vérification AVANT déploiement"
    runs-on: ubuntu-latest
    needs: security-scan 
    if: github.event_name == 'push'

    steps:
      - name: Baseline — Homepage HTTP 200
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.DEFAULT_URI }})
          if [ "$status" -ne 200 ]; then exit 1; fi

      - name: Baseline — Login page HTTP 200
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.DEFAULT_URI }}/login)
          if [ "$status" -ne 200 ]; then exit 1; fi

      - name: Baseline — Catalogue protégé HTTP 302
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" --max-redirs 0 ${{ env.PREPROD_URL }}/product)
          if [ "$status" -ne 302 ]; then exit 1; fi

  deploy:
    name: "6 — Déploiement sur preprod (Coolify)"
    runs-on: ubuntu-latest
    needs: non-regression-pre

    steps:
      - name: Trigger Coolify preprod deployment
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --fail --silent --show-error

  non-regression-post:
    name: "7 — Vérification APRÈS déploiement"
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Vérif homepage
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.PREPROD_URL }})
          if [ "$status" -ne 200 ]; then exit 1; fi

      - name: Vérif login
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.PREPROD_URL }}/login)
          if [ "$status" -ne 200 ]; then exit 1; fi

      - name: Vérif catalogue protégé
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" --max-redirs 0 ${{ env.PREPROD_URL }}/product)
          if [ "$status" -ne 302 ]; then exit 1; fi

  load-test:
    name: "8 — Test de charge (K6 → Grafana Cloud)"
    runs-on: ubuntu-latest
    needs: non-regression-post

    steps:
      - uses: actions/checkout@v4

      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Run K6 load test
        run: |
          k6 cloud run \
            -e BASE_URL=${{ env.PREPROD_URL }} \
            -e K6_USERNAME=${{ secrets.E2E_USER_EMAIL }} \
            -e K6_PASSWORD=${{ secrets.E2E_USER_PASSWORD }} \
            k6/load-test.js
        env:
          K6_CLOUD_TOKEN: ${{ secrets.GRAFANA_TOKEN }}